name: secret-scan

# Every PR is scanned for secrets. The logic lives in NexusHomeLab/.github.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  secret-scan:
    uses: NexusHomeLab/.github/.github/workflows/require-secret-scan.yml@main
    permissions:
      contents: read
