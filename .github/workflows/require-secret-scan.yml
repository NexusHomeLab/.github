name: require-secret-scan

# Shared merge gate for every NexusHomeLab repo: no secrets in any commit of a PR.
# Each repo calls this from its secret-scan.yml; the required check is
# "secret-scan / gitleaks". No secrets, read-only token.
#
# A repo can't silence it: the repo's own .gitleaks.toml, .gitleaksignore and
# inline "gitleaks:allow" comments are all ignored. Exceptions go here, in the
# config below, which only the owner can change (CODEOWNERS).
on:
  workflow_call:

permissions: {}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's checksums.txt)
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit in the PR
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-ignores"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          if ! "$RUNNER_TEMP/gitleaks" git . --log-opts="$BASE..$HEAD" \
              --config "$RUNNER_TEMP/gitleaks.toml" \
              --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores" \
              --ignore-gitleaks-allow --redact --no-banner --exit-code 1; then
            cat <<'MSG'
          ::error::A secret was found in this PR's commits (shown redacted above).
            Treat it as leaked: revoke and rotate it now, even if a later commit removed it.
            Then rewrite the branch without it (git rebase -i, drop or edit the commit) and
            force-push the branch. If it's a false positive, ask the owner to add an
            exception in NexusHomeLab/.github's require-secret-scan.yml.
          MSG
            exit 1
          fi
