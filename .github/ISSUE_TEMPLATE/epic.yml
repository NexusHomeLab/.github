name: Epic
description: A larger goal split into sub-issues.
labels: [epic]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome, and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in, and what's deliberately out.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The end-to-end check that proves the goal is met. Link sub-issues after creating this.
    validations:
      required: true
